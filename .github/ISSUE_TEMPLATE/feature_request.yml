name: Feature request
description: Suggest a feature or improvement
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe how it would work in the game or manager, including keyboard/controller interaction if relevant.
    validations:
      required: true
